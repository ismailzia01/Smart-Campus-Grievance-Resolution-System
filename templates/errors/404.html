{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="empty-state">
    <div class="empty-state-icon">🔍</div>
    <h2>404 — Page Not Found</h2>
    <p class="text-muted">
        The requested campus resource or grievance ticket could not be found.
        It may have been removed or the URL may be incorrect.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Portal Home</a>
</div>
{% endblock %}
