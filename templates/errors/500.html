{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="empty-state">
    <div class="empty-state-icon">⚠️</div>
    <h2>500 — Internal Server Error</h2>
    <p class="text-muted">
        An unexpected error occurred while processing your request.
        The administrative team has been notified. Please try again shortly.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Portal Home</a>
</div>
{% endblock %}
