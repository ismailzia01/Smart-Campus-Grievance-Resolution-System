{% extends "base.html" %}

{% block title %}Bad Request{% endblock %}

{% block content %}
<div class="empty-state">
    <div class="empty-state-icon">🛑</div>
    <h2>400 — Invalid Request</h2>
    <p class="text-muted">
        Your browser sent a request that this server could not understand.
        This commonly happens if a CSRF security token expired or is missing.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Portal Home</a>
</div>
{% endblock %}
